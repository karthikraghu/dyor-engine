version: "3.9"

networks:
  sandbox-net:
    internal: true      # No internet access for sandbox (BUG 3 fix)
  backend-net:
    driver: bridge      # Services that need internet access

services:
  # ── Execution Sandbox ──────────────────────────────────────────────
  sandbox:
    build:
      context: .
      dockerfile: services/sandbox/Dockerfile
    container_name: trader-sandbox
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro               # READ-ONLY (BUG 2 fix)
    environment:
      - SANDBOX_HOST=0.0.0.0
      - SANDBOX_PORT=8000
      - DATA_DIR=/app/data
      - SANDBOX_TIMEOUT=30
    mem_limit: 512m                        # BUG 4 fix
    cpus: 0.5                              # BUG 4 fix
    restart: unless-stopped
    networks:
      - sandbox-net                        # Isolated network (BUG 3 fix)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Data Ingester (run once to fetch data) ─────────────────────────
  data_ingester:
    build:
      context: .
      dockerfile: services/data_ingester/Dockerfile
    container_name: trader-data-ingester
    volumes:
      - ./data:/app/data
    environment:
      - EXCHANGE_ID=binance
      - TRADING_PAIR=BTC/USDT
      - TIMEFRAME=1h
      - OHLCV_LIMIT=1000
      - DATA_DIR=/app/data
    networks:
      - backend-net
    profiles:
      - fetch

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trader-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── AI Orchestrator ────────────────────────────────────────────────
  ai_orchestrator:
    build:
      context: .
      dockerfile: services/ai_orchestrator/Dockerfile
    container_name: trader-ai-orchestrator
    ports:
      - "8010:8010"
    volumes:
      - ./data:/app/data:ro
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ORCHESTRATOR_PORT=8010
      - ORCHESTRATOR_RISK_PROFILE=balanced
      - ORCHESTRATOR_MODEL_PROVIDER=heuristic
      - ORCHESTRATOR_MODEL_NAME=rule-based-v1
      - DATA_DIR=/app/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
